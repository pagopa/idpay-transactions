
name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - uat
      - develop
  pull_request:
    types:
      - opened
      - edited
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: idpay_transactions
          POSTGRES_USER: idpay
          POSTGRES_PASSWORD: idpay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U idpay -d idpay_transactions"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0  # Fetch all history for all branches and tags

      - name: Set up JDK 25
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: 'adopt'
          java-version: '25'

      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Apply PostgreSQL schema for jOOQ
        env:
          PGPASSWORD: idpay
        run: |
          for migration in src/main/resources/db/migration/*.sql; do
            psql --host localhost --username idpay --dbname idpay_transactions \
              --set ON_ERROR_STOP=1 --file "$migration"
          done

      - name: Build and test with Maven
        env:
          JOOQ_JDBC_URL: jdbc:postgresql://localhost:5432/idpay_transactions
          JOOQ_JDBC_USERNAME: idpay
          JOOQ_JDBC_PASSWORD: idpay
        run: mvn clean -Pjooq-codegen org.jacoco:jacoco-maven-plugin:0.8.14:prepare-agent verify org.jacoco:jacoco-maven-plugin:0.8.14:report org.jacoco:jacoco-maven-plugin:0.8.14:report-aggregate -B

      - name: Generate JaCoCo XML Report
        run: mvn org.jacoco:jacoco-maven-plugin:0.8.14:report -Djacoco.reportFormat=xml -B

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=${{ vars.SONARCLOUD_PROJECT_KEY }} \
            -Dsonar.organization=${{ vars.SONARCLOUD_ORG }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.junit.reportPaths=target/surefire-reports \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.exclusions=**/configuration/**,**/enums/**,**/model/**,**/stub/**,**/dto/**,**/*Constant*,**/*Config.java,**/*Scheduler.java,**/*Application.java,**/src/test/**,**/Dummy*.java

      - name: Fetch all branches
        run: git fetch --all
